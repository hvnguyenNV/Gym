name: linguasafe
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: safety
description: Derived binary prompt safety classification on LinguaSafe, retaining original severity and language
modality: text
licensing: Apache-2.0 AND CC-BY-NC-SA-4.0
authors:
- hvnguyenNV
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
dataset_owner: linguasafe_benchmark_simple_agent
resources_server: multilingual_safety
agent_server: simple_agent
datasets:
- name: linguasafe
  type: benchmark
  jsonl_fpath: benchmarks/linguasafe/data/linguasafe_benchmark.jsonl
  prepare_script: benchmarks/linguasafe/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
prompt_source: prepared
lifecycle: active

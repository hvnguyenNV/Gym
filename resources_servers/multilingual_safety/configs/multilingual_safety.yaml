multilingual_safety:
  resources_servers:
    multilingual_safety:
      entrypoint: app.py
      domain: safety
      verified: false
      description: Multilingual prompt and response safety classification against source labels
      value: Binary classification accuracy and unsafe-positive F1 by benchmark, task, and language

multilingual_safety_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: multilingual_safety
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/multilingual_safety/data/example.jsonl
        num_repeats: 1
        license: Apache-2.0

multilingual_safety_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: multilingual_safety_simple_agent
